name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
        working-directory: ui

      - run: cargo xtask fetch-model

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p patent-embed --features parity

      - name: cargo install tauri-cli
        run: cargo install tauri-cli --locked --version "^2"

      - name: Build release .exe
        run: cargo tauri build --no-bundle

      - name: Dependency check (no vcruntime*.dll, no onnxruntime.dll)
        shell: pwsh
        run: |
          $exe = "target/release/patent-tagger.exe"
          $deps = dumpbin /dependents $exe | Out-String
          Write-Host $deps
          if ($deps -match "vcruntime|onnxruntime") {
            Write-Error "Unexpected dynamic dependency found (expected static CRT, no ONNX Runtime)."
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: patent-tagger-windows
          path: target/release/patent-tagger.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Exact package list per the Tauri 2 Linux prerequisites documentation.
      - name: Install Tauri build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            pkg-config \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
        working-directory: ui

      - run: cargo xtask fetch-model

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p patent-embed --features parity

      - name: cargo install tauri-cli
        run: cargo install tauri-cli --locked --version "^2"

      - name: Build .deb and AppImage
        run: cargo tauri build --bundles deb,appimage

      - name: Dependency check (no onnxruntime, no OpenSSL beyond Tauri's own needs)
        run: |
          deps=$(objdump -p target/release/patent-tagger | grep NEEDED)
          echo "$deps"
          if echo "$deps" | grep -qi onnxruntime; then
            echo "Unexpected onnxruntime dependency found." >&2
            exit 1
          fi

      - name: Smoke-install the .deb in a clean Ubuntu 24.04 container
        run: |
          deb=$(find target/release/bundle/deb -name '*.deb')
          docker run --rm -v "$PWD:/work" ubuntu:24.04 bash -euxc "
            apt-get update
            apt-get install -y /work/$deb
          "

      - uses: actions/upload-artifact@v4
        with:
          name: patent-tagger-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
