[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/ops",
    "crates/embed",
    "src-tauri",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "0BSD"
repository = "https://github.com/TODO/patent-scout"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
