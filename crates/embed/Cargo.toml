[package]
name = "patent-embed"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "embed_lib"
path = "src/lib.rs"

[dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2"
tokenizers = { version = "0.22", default-features = false }

[features]
parity = []

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
