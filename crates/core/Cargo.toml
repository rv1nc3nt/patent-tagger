[package]
name = "patent-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "core_lib"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.39", features = ["bundled"] }
rusqlite_migration = "=2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"

[dev-dependencies]
tempfile = "3.27.0"
