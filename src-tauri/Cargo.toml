[package]
name = "patent-tagger"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Desktop application for importing, tagging and exporting patents via EPO OPS."

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6" }
tauri-plugin-log = "2"
directories = "6.0.0"
anyhow = "1.0.104"
patent-core = { version = "0.1.0", path = "../crates/core" }

[dev-dependencies]
tempfile = "3.27.0"
