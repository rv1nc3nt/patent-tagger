[package]
name = "patent-tagger"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Desktop application for importing, tagging and exporting patents via EPO OPS."

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6" }
tauri-plugin-log = "2"
directories = "6.0.0"
anyhow = "1.0.104"
patent-core = { version = "0.1.0", path = "../crates/core" }
keyring = "4.2.0"
patent-ops = { version = "0.1.0", path = "../crates/ops" }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
patent-embed = { version = "0.1.0", path = "../crates/embed" }
tauri-plugin-opener = "2.5.5"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt", "time", "sync"] }

[target.'cfg(windows)'.dependencies]
# SPEC 7.7: "the release binary uses the GUI subsystem, so command-line
# mode must attach to the parent console (AttachConsole via windows-sys)."
windows-sys = { version = "0.60", features = ["Win32_System_Console"] }
